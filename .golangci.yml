version: "2"
linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
  settings:
    gosec:
      excludes:
        - G204 # `secretkit run` executes a user-supplied command by design
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters: [gosec, bodyclose]
formatters:
  enable:
    - gofmt
    - goimports
