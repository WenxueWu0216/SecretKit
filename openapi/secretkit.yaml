openapi: 3.0.3
info:
  title: SecretKit API
  version: 0.1.0
  description: |
    API for the SecretKit mock secrets server.

    Authentication uses the OAuth 2.0 Device Authorization Grant (RFC 8628)
    with PKCE (RFC 7636) bound to the device code. Access tokens are short-lived
    bearer tokens; refresh tokens rotate on every use.
servers:
  - url: http://127.0.0.1:8787
tags:
  - name: auth
  - name: secrets
paths:
  /oauth/device/code:
    post:
      tags: [auth]
      operationId: requestDeviceCode
      summary: Start a device authorization request.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceCodeRequest'
      responses:
        '200':
          description: Device code issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCodeResponse'
        '400':
          $ref: '#/components/responses/OAuthError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /oauth/device/verify:
    post:
      tags: [auth]
      operationId: verifyDeviceCode
      summary: Approve or deny a pending user code.
      description: |
        Stands in for the browser page a user would visit. The mock server
        approves or denies the request without a login screen.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceVerifyRequest'
      responses:
        '204':
          description: Decision recorded.
        '400':
          $ref: '#/components/responses/OAuthError'
        '404':
          $ref: '#/components/responses/NotFound'
  /oauth/token:
    post:
      tags: [auth]
      operationId: requestToken
      summary: Exchange a device code or refresh token for tokens.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Tokens issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/OAuthError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /oauth/revoke:
    post:
      tags: [auth]
      operationId: revokeToken
      summary: Revoke a refresh token and its access tokens.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RevokeRequest'
      responses:
        '200':
          description: Token revoked, or it was already unknown (RFC 7009).
        '400':
          $ref: '#/components/responses/OAuthError'
  /v1/secrets:
    get:
      tags: [secrets]
      operationId: listSecrets
      summary: List secret metadata. Values are never included.
      security:
        - bearerAuth: [secrets:read]
      responses:
        '200':
          description: Secret metadata, sorted by name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/secrets/{name}:
    parameters:
      - $ref: '#/components/parameters/SecretName'
    get:
      tags: [secrets]
      operationId: getSecret
      summary: Read a secret value.
      security:
        - bearerAuth: [secrets:read]
      responses:
        '200':
          description: The secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags: [secrets]
      operationId: putSecret
      summary: Create or replace a secret. Each write bumps the version.
      security:
        - bearerAuth: [secrets:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutSecretRequest'
      responses:
        '200':
          description: Metadata of the stored secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretMetadata'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    SecretName:
      name: name
      in: path
      required: true
      description: Secret names are valid environment variable names.
      schema:
        type: string
        pattern: '^[A-Za-z_][A-Za-z0-9_]{0,127}$'
  responses:
    OAuthError:
      description: OAuth error (RFC 6749 section 5.2, RFC 8628 section 3.5).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: The request is malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, expired, or revoked access token.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The token lacks the required scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Unexpected server failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Machine-readable error code.
          enum:
            - invalid_request
            - invalid_client
            - invalid_grant
            - invalid_scope
            - unsupported_grant_type
            - authorization_pending
            - slow_down
            - access_denied
            - expired_token
            - invalid_token
            - insufficient_scope
            - not_found
            - rate_limited
            - server_error
        error_description:
          type: string
          description: Human-readable detail. Never contains secret values.
    DeviceCodeRequest:
      type: object
      required: [client_id, code_challenge, code_challenge_method]
      properties:
        client_id:
          type: string
        scope:
          type: string
          description: Space-separated scopes. Defaults to "secrets:read".
          example: secrets:read secrets:write
        code_challenge:
          type: string
          description: BASE64URL(SHA256(code_verifier)), unpadded.
        code_challenge_method:
          type: string
          enum: [S256]
    DeviceCodeResponse:
      type: object
      required: [device_code, user_code, verification_uri, expires_in, interval]
      properties:
        device_code:
          type: string
        user_code:
          type: string
          example: BDWP-HQPK
        verification_uri:
          type: string
        verification_uri_complete:
          type: string
        expires_in:
          type: integer
          description: Lifetime of the device code in seconds.
        interval:
          type: integer
          description: Minimum polling interval in seconds.
    DeviceVerifyRequest:
      type: object
      required: [user_code, action]
      properties:
        user_code:
          type: string
        action:
          type: string
          enum: [approve, deny]
    TokenRequest:
      type: object
      required: [grant_type, client_id]
      properties:
        grant_type:
          type: string
          enum:
            - urn:ietf:params:oauth:grant-type:device_code
            - refresh_token
        client_id:
          type: string
        device_code:
          type: string
          description: Required for the device_code grant.
        code_verifier:
          type: string
          description: Required for the device_code grant.
        refresh_token:
          type: string
          description: Required for the refresh_token grant.
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, scope]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
        refresh_token:
          type: string
        scope:
          type: string
    RevokeRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
        token_type_hint:
          type: string
          enum: [refresh_token, access_token]
    PutSecretRequest:
      type: object
      required: [value]
      properties:
        value:
          type: string
          maxLength: 65536
    SecretMetadata:
      type: object
      required: [name, version, updated_at]
      properties:
        name:
          type: string
        version:
          type: integer
          format: int64
        updated_at:
          type: string
          format: date-time
    Secret:
      allOf:
        - $ref: '#/components/schemas/SecretMetadata'
        - type: object
          required: [value]
          properties:
            value:
              type: string
    SecretList:
      type: object
      required: [secrets]
      properties:
        secrets:
          type: array
          items:
            $ref: '#/components/schemas/SecretMetadata'
